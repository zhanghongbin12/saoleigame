
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探雷特工</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html {
      background: #030712;
    }

    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    .board-scan {
      background:
        linear-gradient(180deg, transparent 0%, rgba(34, 211, 238, 0.16) 48%, transparent 100%),
        linear-gradient(90deg, rgba(34, 211, 238, 0.04), transparent 22%, transparent 78%, rgba(253, 224, 71, 0.04));
      background-size: 100% 24%, 100% 100%;
      background-repeat: no-repeat;
      animation: none;
      background-position: 0 52%, 0 0;
      opacity: 0.28;
    }

    .board-performance .cell-pop {
      animation-duration: 90ms;
    }

    .board-dense .ai-hint-cell::before {
      inset: -5px;
    }

    .board-dense .ai-hint-badge {
      font-size: 10px;
      height: 20px;
      right: -10px;
      top: -10px;
      width: 20px;
    }

    .board-dense .ai-hint-target {
      inset: -4px;
    }

    .cell-pop {
      animation: cell-pop 180ms ease-out;
    }

    .hint-beacon {
      animation: hint-beacon 1s ease-in-out infinite;
    }

    .ai-hint-cell {
      isolation: isolate;
      z-index: 20;
    }

    .ai-hint-cell::before {
      border-radius: 11px;
      content: '';
      inset: -7px;
      position: absolute;
      z-index: -1;
    }

    .ai-hint-flag {
      animation: ai-hint-bounce 760ms ease-in-out infinite;
      box-shadow:
        0 0 0 3px rgba(253, 224, 71, 0.85),
        0 0 0 7px rgba(244, 63, 94, 0.38),
        0 0 34px rgba(244, 63, 94, 0.72);
    }

    .ai-hint-reveal {
      animation: ai-hint-bounce 760ms ease-in-out infinite;
      box-shadow:
        0 0 0 3px rgba(165, 243, 252, 0.9),
        0 0 0 7px rgba(34, 211, 238, 0.36),
        0 0 34px rgba(34, 211, 238, 0.66);
    }

    .ai-hint-flag::before {
      background: radial-gradient(circle, rgba(253, 224, 71, 0.36), rgba(244, 63, 94, 0.16) 48%, transparent 72%);
      animation: ai-hint-pulse 1.15s ease-out infinite;
    }

    .ai-hint-reveal::before {
      background: radial-gradient(circle, rgba(165, 243, 252, 0.35), rgba(34, 211, 238, 0.14) 48%, transparent 72%);
      animation: ai-hint-pulse 1.15s ease-out infinite;
    }

    .ai-hint-target {
      border: 2px solid currentColor;
      border-radius: 12px;
      inset: -5px;
      opacity: 0.9;
      pointer-events: none;
      position: absolute;
    }

    .ai-hint-flag .ai-hint-target {
      color: #fde047;
    }

    .ai-hint-reveal .ai-hint-target {
      color: #67e8f9;
    }

    .ai-hint-target::before,
    .ai-hint-target::after {
      background: currentColor;
      content: '';
      left: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .ai-hint-target::before {
      height: 2px;
      width: calc(100% + 10px);
    }

    .ai-hint-target::after {
      height: calc(100% + 10px);
      width: 2px;
    }

    .ai-hint-badge {
      align-items: center;
      background: #fde047;
      border: 2px solid #020617;
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(253, 224, 71, 0.75);
      color: #020617;
      display: flex;
      font-size: 12px;
      font-weight: 900;
      height: 24px;
      justify-content: center;
      line-height: 1;
      pointer-events: none;
      position: absolute;
      right: -13px;
      top: -13px;
      width: 24px;
      z-index: 30;
    }

    .alarm-shake {
      animation: alarm-shake 420ms ease-in-out;
    }

    @keyframes scan-board {
      0% { background-position: 0 -28%, 0 0; }
      100% { background-position: 0 128%, 0 0; }
    }

    @keyframes cell-pop {
      0% { transform: scale(0.72); filter: brightness(1.45); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes hint-beacon {
      0%, 100% { box-shadow: 0 0 0 rgba(34, 211, 238, 0); transform: translateY(0); }
      50% { box-shadow: 0 0 24px rgba(34, 211, 238, 0.32); transform: translateY(-1px); }
    }

    @keyframes ai-hint-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.08); }
    }

    @keyframes ai-hint-pulse {
      0% { opacity: 0.95; transform: scale(0.88); }
      100% { opacity: 0; transform: scale(1.75); }
    }

    @keyframes alarm-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
  </style>
